  <g stroke="#8b98aa" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M198 144 H238"/>
    <path d="M388 144 H428"/>
    <path d="M578 144 H618"/>
    <path d="M768 144 H808"/>
    <path d="M958 144 H965"/>
