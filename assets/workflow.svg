<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-label="Z-PRD workflow">
  <rect width="1120" height="300" fill="#f7f8fb"/>
  <text x="560" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Z-PRD 产品工作流</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#172033">
    <g transform="translate(48 105)">
      <rect width="150" height="78" rx="14" fill="#ffffff" stroke="#c9d2e3"/>
      <text x="75" y="34" text-anchor="middle" font-weight="700">一句话想法</text>
      <text x="75" y="58" text-anchor="middle" fill="#526173">Idea</text>
    </g>
    <g transform="translate(238 105)">
      <rect width="150" height="78" rx="14" fill="#ffffff" stroke="#c9d2e3"/>
      <text x="75" y="34" text-anchor="middle" font-weight="700">PRD</text>
      <text x="75" y="58" text-anchor="middle" fill="#526173">需求与验收</text>
    </g>
    <g transform="translate(428 105)">
      <rect width="150" height="78" rx="14" fill="#ffffff" stroke="#c9d2e3"/>
      <text x="75" y="34" text-anchor="middle" font-weight="700">产品设计</text>
      <text x="75" y="58" text-anchor="middle" fill="#526173">流程与状态</text>
    </g>
    <g transform="translate(618 105)">
      <rect width="150" height="78" rx="14" fill="#fff8e6" stroke="#d6a73a"/>
      <text x="75" y="34" text-anchor="middle" font-weight="700">人工评审</text>
      <text x="75" y="58" text-anchor="middle" fill="#7a5a13">Review Gate</text>
    </g>
    <g transform="translate(808 105)">
      <rect width="150" height="78" rx="14" fill="#ffffff" stroke="#c9d2e3"/>
      <text x="75" y="34" text-anchor="middle" font-weight="700">UI 原型</text>
      <text x="75" y="58" text-anchor="middle" fill="#526173">Prototype Plan</text>
    </g>
    <g transform="translate(965 105)">
      <rect width="120" height="78" rx="14" fill="#ffffff" stroke="#c9d2e3"/>
