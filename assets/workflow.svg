  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98aa"/>
    </marker>
  </defs>
  <text x="560" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#526173">默认先评审产品文档，确认后再进入 UI 原型或开发。</text>
